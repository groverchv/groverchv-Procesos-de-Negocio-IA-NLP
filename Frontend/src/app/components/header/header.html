<nz-header class="app-header">
  <div class="header-content">
    <div style="display: flex; align-items: center; gap: 16px;">
      <!-- Toggle Sidebar Button -->
      <button *ngIf="showToggle" nz-button nzType="text" class="sidebar-toggle-btn" (click)="onToggleSidebar()">
        <span nz-icon [nzType]="sidebarCollapsed ? 'menu-unfold' : 'menu-fold'"></span>
      </button>

      <div class="logo-section" routerLink="/">
        <span class="logo-text">Proceso de <span class="logo-accent">Negocio</span></span>
      </div>
    </div>

    <!-- Se eliminó nav-section a petición del usuario para moverlo al menú lateral izquierdo -->

    <div class="user-section">
      <nz-space nzSize="large">
        <div class="user-profile">
          <nz-avatar nzIcon="user" [style.backgroundColor]="isStaff ? '#10b981' : '#7c3aed'"></nz-avatar>
          <span class="user-name">{{ isStaff ? 'Funcionario' : 'Administrador' }}</span>
        </div>
      </nz-space>
    </div>
  </div>
</nz-header>
