spring.application.name=Procesos

# MongoDB Configuration — uses MONGODB_URI env var in production (Railway),
# falls back to local MongoDB for local development.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/proceso}

spring.data.mongodb.auto-index-creation=true

# Server Configuration — Railway injects PORT automatically
server.port=${PORT:8080}

# Logging level for debugging data operations
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.web=INFO
