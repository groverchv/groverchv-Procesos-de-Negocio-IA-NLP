name: procesos_movil
description: "App móvil para visualizar diagramas de procesos y estado de actividades en tiempo real."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  http: ^1.1.0
  http_parser: ^4.0.0
  web_socket_channel: ^2.4.0
  stomp_dart_client: ^3.0.1
  json_annotation: ^4.8.1
  provider: ^6.0.0
  intl: ^0.18.1
  
  # Offline-First
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  connectivity_plus: ^5.0.2

  # Audios y NLP para el Asistente IA
  speech_to_text: ^6.6.0
  audioplayers: ^5.2.1

  # Firebase y Notificaciones Push
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^17.0.0
  file_picker: ^8.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700
